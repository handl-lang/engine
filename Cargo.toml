[package]
name = "hnl-engine"
version = "0.1.0"
edition = "2024"
description = "Foundation types for pluggable interpretation and rewrite models."
license = "MIT"
repository = "https://github.com/handl-lang/engine"

[dependencies]
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacker = "0.1"

[patch."https://github.com/handl-lang/kernel"]
handl-value = { path = "../kernel/crates/handl-value" }
