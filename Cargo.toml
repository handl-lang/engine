[package]
name = "hnl-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Foundation types for pluggable interpretation and rewrite models."
license = "MIT"
repository = "https://github.com/handl-lang/engine"
homepage = "https://handl-lang.github.io/docs/engine/"
documentation = "https://handl-lang.github.io/docs/engine/reference/"
readme = "README.md"
keywords = ["handl", "engine", "language-as-data"]
categories = ["development-tools", "compilers"]

[dependencies]
handl-calculus = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacker = "0.1"

[patch."https://github.com/handl-lang/kernel"]
handl-calculus = { path = "../kernel/crates/handl-calculus" }
handl-value = { path = "../kernel/crates/handl-value" }
